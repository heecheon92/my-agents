[project]
name = "my-agents"
version = "0.1.0"
description = "OpenAI-backed FastAPI and LangGraph personal assistant backend foundation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "docling>=2.95.0",
    "email-validator>=2.3.0",
    "fastapi[standard]",
    "httpx>=0.28.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "openai>=2.36.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.4.2",
    "prometheus-client>=0.25.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.11.0",
    "python-pptx>=1.0.2",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=5.5.1",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
extend-exclude = [".agents", ".codex"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
