[project]
name = "my-agents"
version = "0.1.0"
description = "OpenAI-backed FastAPI and LangGraph personal assistant backend foundation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi[standard]",
    "langchain-openai>=1.2.1",
    "langgraph",
    "langgraph-swarm>=0.1.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
